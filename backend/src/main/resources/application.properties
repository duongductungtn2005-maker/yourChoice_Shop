spring.application.name=YourChoiceShop
# Server Port
server.port=8080

# Database Connection (Thay 'sa' v� 'password' b?ng th�ng tin c?a b?n)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=YourChoiceShopDB;encrypt=true;trustServerCertificate=true
